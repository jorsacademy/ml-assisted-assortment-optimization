[project]
name = "causal-pricing-promotion-nonlinear-optimization"
version = "0.1.0"
description = "S-Learner response curves and constrained nonlinear optimization for promotion budget allocation."
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.6,<5",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
